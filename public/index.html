<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKII - High Premium Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-cyber-gradient: radial-gradient(circle at center, #1b0005 0%, #030001 100%);
            --glass-card: rgba(15, 1, 4, 0.96);
            --neon-red: #ff0033;
            --neon-glow: #ff2c54;
            --heavy-border: rgba(255, 0, 51, 0.4);
            --cyan-glow: #00e5ff;
        }

        body {
            background: var(--bg-cyber-gradient);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 450px;
            width: 92%;
            background: var(--glass-card);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 0 65px rgba(255, 0, 51, 0.3);
            border: 1px solid var(--heavy-border);
            text-align: center;
            box-sizing: border-box;
        }

        .hack-title {
            font-size: 36px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 4px;
            color: var(--neon-red);
            text-shadow: 0 0 30px rgba(255, 0, 51, 0.9);
        }

        .timer-box {
            font-size: 15px;
            margin: 20px 0;
            background: rgba(0,0,0,0.85);
            padding: 14px;
            border-radius: 10px;
            border: 1px dashed var(--neon-red);
        }

        .prediction-box {
            background: rgba(4, 0, 1, 0.98);
            border: 1px solid rgba(255, 0, 51, 0.4);
            padding: 25px 15px;
            border-radius: 16px;
            margin-top: 20px;
        }

        .trend-badge {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0;
            text-shadow: 0 0 20px currentColor;
            transition: color 0.3s ease;
        }

        .numbers-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .num-block {
            background: linear-gradient(135deg, rgba(255, 0, 51, 0.15), rgba(20, 0, 3, 0.8));
            border: 1px solid rgba(255, 0, 51, 0.5);
            padding: 15px 0;
            width: 120px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.25);
        }

        .num-val {
            font-size: 48px;
            font-weight: 900;
            display: block;
            text-shadow: 0 0 15px var(--neon-red);
        }

        .num-lbl {
            font-size: 12px;
            color: var(--neon-glow);
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="hack-title">HACKII</h1>
        <p style="font-size:11px; color:#888; letter-spacing:3px; margin: 5px 0 25px 0;">LIVE PATTERN DETECTION TERMINAL</p>

        <div style="text-align:left; font-size:12px; background:rgba(0,0,0,0.5); padding:10px; border-radius:8px; border-left:3px solid var(--neon-red);">
            📡 NODE SYSTEM ACCESS UID: <span id="uidDisplay" style="color:var(--neon-glow); font-weight:bold;">-</span>
        </div>

        <div class="timer-box" id="timerDisplay">⏳ REFRESHING IN: 00:60s</div>

        <div class="prediction-box">
            <div style="font-size:12px; color:var(--neon-glow); font-weight:bold; letter-spacing:1px;">UPCOMING PERIOD</div>
            <h2 id="periodId" style="font-size:28px; margin:8px 0; font-family:monospace; color:#fff;">----</h2>
            
            <hr style="border:0; border-top:1px solid rgba(255,0,51,0.2); margin:20px 0;">

            <div style="font-size:11px; color:#aaa; letter-spacing:1px;">ANALYSIS TREND TARGET</div>
            <div id="trendPrediction" class="trend-badge" style="color: #ffcc00;">LOADING...</div>

            <div style="font-size:11px; color:#aaa; letter-spacing:1px; margin-top:20px;">HIGH PROBABILITY NUMBERS</div>
            <div class="numbers-container">
                <div class="num-block">
                    <span id="num1" class="num-val">-</span>
                    <span id="chance1" class="num-lbl">0%</span>
                </div>
                <div class="num-block">
                    <span id="num2" class="num-val">-</span>
                    <span id="chance2" class="num-lbl">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uid = localStorage.getItem('user_uid');
        if(!uid) { window.location.href = 'index.html'; }
        document.getElementById('uidDisplay').innerText = uid || "-";

        // Real countdown timer loops logic
        setInterval(() => {
            const rem = 60 - (new Date().getSeconds());
            document.getElementById('timerDisplay').innerText = `⏳ REFRESHING IN: 00:${rem < 10 ? "0"+rem : rem}s`;
        }, 1000);

        const socket = io();
        socket.on('predictionUpdate', (data) => {
            if(data && data.period) {
                document.getElementById('periodId').innerText = data.period;
                
                const trendEl = document.getElementById('trendPrediction');
                trendEl.innerText = data.prediction;
                trendEl.style.color = (data.prediction === "BIG") ? "#ff3300" : "#00e5ff"; 

                if (data.topNumbers && data.topNumbers.length >= 2) {
                    document.getElementById('num1').innerText = data.topNumbers[0].num;
                    document.getElementById('chance1').innerText = data.topNumbers[0].chance + "%";
                    document.getElementById('num2').innerText = data.topNumbers[1].num;
                    document.getElementById('chance2').innerText = data.topNumbers[1].chance + "%";
                }
            }
        });
    </script>
</body>
</html>

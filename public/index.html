<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaar Win with Hackii - High-End Terminal</title>
    <style>
        :root {
            --bg-dark: #030001;
            --cyber-gradient: radial-gradient(circle at center, #1c0206 0%, #030001 100%);
            --mainframe-card: rgba(14, 2, 4, 0.95);
            --neon-red: #ff0033;
            --neon-laser: #ff2c54;
            --border-line: rgba(255, 0, 51, 0.35);
            --text-main: #ffffff;
            --text-dim: #cccccc;
        }

        body {
            background: var(--cyber-gradient);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 440px;
            width: 92%;
            background: var(--mainframe-card);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(255, 0, 51, 0.25);
            border: 1px solid var(--border-line);
            backdrop-filter: blur(20px);
            box-sizing: border-box;
            text-align: center;
        }

        .hack-title {
            font-size: 30px;
            font-weight: 900;
            margin: 5px 0;
            letter-spacing: 2px;
            color: var(--neon-red);
            text-shadow: 0 0 25px rgba(255, 0, 51, 0.8);
        }

        .sub-title {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--text-dim);
        }

        .action-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 0, 51, 0.15);
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background: rgba(5, 1, 2, 0.9);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--neon-laser);
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #cc0029, #730014);
            border: 1px solid var(--neon-laser);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #ff0033, #99001a);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.6);
        }

        .btn-reg {
            background: linear-gradient(135deg, #ff0033, #b30022);
            margin-bottom: 12px;
        }

        .msg-display {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 700;
            color: #ffcc00;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container" onclick="playWelcomeVoice()">
        <h1 class="hack-title">YAAR WIN MAINFRAME</h1>
        <h2 class="sub-title">PREMIUM PATTERN DETECTOR</h2>

        <div class="action-box">
            <button class="btn-reg" onclick="window.location.href='https://4yaarwin.com/#/register?invitationCode=18426755757'">SECURE REGISTER LINK</button>
            <p style="font-size: 12px; color: var(--text-dim); margin: 8px 0;">Naya account banakar apni UID niche box me dalein.</p>
        </div>

        <input type="text" id="uidInput" placeholder="Enter Game UID Key...">
        <button onclick="verifyUID()">LAUNCH SERVER TERMINAL</button>

        <div id="msgBox" class="msg-display">Tap anywhere to sync audio node.</div>
    </div>

    <script>
        let voicePlayed = false;

        // Link tap or interaction standard male AI voice logic
        function playWelcomeVoice() {
            if (voicePlayed) return;
            
            const text = "HACKII yaar win panel me apka swagat hai. Kripya apni new yaar win ki id box me dalker panel ko open kare";
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Fetching systems high quality male voice profiles
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(voice => voice.name.toLowerCase().includes('google hindi') || voice.name.toLowerCase().includes('male'));
            
            if (maleVoice) utterance.voice = maleVoice;
            utterance.rate = 0.95; 
            utterance.pitch = 1.0; 

            window.speechSynthesis.speak(utterance);
            voicePlayed = true;
            document.getElementById('msgBox').innerText = "Audio Stream Operational.";
        }

        async function verifyUID() {
            const uid = document.getElementById('uidInput').value.trim();
            const msgBox = document.getElementById('msgBox');
            
            if(!uid) {
                msgBox.innerText = "Error: Input box cannot be empty!";
                return;
            }

            try {
                const res = await fetch('/api/user/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                const data = await res.json();
                
                if(data.status === 'approved') {
                    localStorage.setItem('user_uid', uid);
                    window.location.href = 'dashboard.html';
                } else {
                    // Custom verification notice prompt rule injected here
                    msgBox.innerText = "HACKII bhai se uid verification karbou";
                    msgBox.style.color = "var(--neon-laser)";
                }
            } catch (err) {
                msgBox.innerText = "Network transmission error.";
            }
        }

        // Pre-load voices matrix
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    </script>
</body>
</html>

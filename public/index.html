<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Yaar Win with Hackii - Access Terminal</title>
</head>
<body>
    <div class="container">
        <h1 class="hack-title" style="color: var(--gold); text-shadow: 0 0 25px rgba(255,170,0,0.6);">⚡YAAR WIN WITH HACKII ⚡</h1>
        <h2 class="sub-title" style="color: var(--neon-cyan); text-shadow: 0 0 12px rgba(0,229,255,0.4);">DETECTIVE ALGORITHM SYSTEM</h2>
        
        <div style="background: rgba(255, 255, 255, 0.02); padding: 22px; border-radius: 18px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.06);">
            <p style="font-size: 13px; color: #fff; margin: 0 0 14px 0; font-weight: 600; opacity: 0.9;">System Notice: Ensure your dynamic validation sequence account on YaarWin is verified:</p>
            <button onclick="window.location.href='https://4yaarwin.com/#/register?invitationCode=18426755757'" style="background: linear-gradient(135deg, #ff0055, #ff4500); box-shadow: 0 5px 18px rgba(255, 0, 85, 0.45);">SECURE REGISTER LINK</button>
        </div>

        <p style="font-size: 13px; color: #b3b3b3; margin-bottom: 8px;">Provide your authorized mainframe key below:</p>
        <input type="text" id="uidInput" placeholder="Enter Dynamic Access UID...">
        <button onclick="verifyUID()">START NOW</button>
        
        <div id="msgBox" style="margin-top: 20px; font-size: 14px; font-weight: 600; min-height: 20px;"></div>
        
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.07); margin: 30px 0;">
        <p style="font-size: 12px; color: #8c8c8c; line-height: 1.5;">Require active authorization nodes or validity credentials? Contact central desk:</p>
        <button class="btn-tg" onclick="window.location.href='https://t.me/hackii_sureshote'">REQUEST UID VERIFY</button>
    </div>

    <script>
        async function verifyUID() {
            const uid = document.getElementById('uidInput').value.trim();
            const msgBox = document.getElementById('msgBox');
            if(!uid) {
                msgBox.innerText = "Error: Security input string missing!";
                msgBox.style.color = "var(--neon-pink)";
                return;
            }
            
            try {
                const res = await fetch('/api/user/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                const data = await res.json();
                
                if(data.status === 'approved') {
                    localStorage.setItem('user_uid', uid);
                    window.location.href = 'dashboard.html';
                } else {
                    msgBox.innerText = data.message;
                    msgBox.style.color = "var(--neon-pink)";
                }
            } catch (err) {
                msgBox.innerText = "Network channel timeout. Re-establishing connection...";
                msgBox.style.color = "var(--neon-pink)";
            }
        }
    </script>
</body>
</html>

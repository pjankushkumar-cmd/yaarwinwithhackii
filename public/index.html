<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKII ULTRA PATTERN MATRIX</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* ==================================================================
           YOUR ORIGINAL EMBEDDED PRODUCTION CSS SPECIFICATIONS
           ================================================================== */
        :root {
            --bg-dark: #020001;
            --cyber-radial: radial-gradient(circle at center, #1b0105 0%, #020001 100%);
            --card-surface: rgba(13, 2, 4, 0.97);
            --neon-red: #ff0033;
            --neon-laser: #ff2c54;
            --neon-cyan: #00e5ff;
            --gold: #ffaa00;
            --text-white: #ffffff;
            --text-muted: #a6a6a6;
            --border-glow: rgba(255, 0, 51, 0.36);
        }

        body {
            background: var(--cyber-radial);
            color: var(--text-white);
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            max-width: 440px;
            width: 92%;
            background: var(--card-surface);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 0 80px rgba(255, 0, 51, 0.32);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .brand-title {
            font-size: 50px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 6px;
            color: var(--neon-red);
            text-shadow: 0 0 35px rgba(255, 0, 51, 0.95);
        }

        .sub-title {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 8px 0 30px 0;
            color: var(--text-muted);
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.88);
            padding: 22px 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 0, 51, 0.2);
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-muted);
            margin: 10px 0 0 0;
            line-height: 1.4;
        }

        .input-container {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px;
            background: rgba(4, 1, 2, 0.97);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            color: var(--text-white);
            font-size: 15px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--neon-laser);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            color: var(--text-white);
            font-weight: bold;
            font-size: 15px;
            border-radius: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #cc0029, #730014);
            border: 1px solid var(--neon-laser);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ff0033, #99001a);
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.7);
        }

        .dashboard-badge {
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            margin: 5px 0 20px 0;
        }

        .uid-tag {
            font-size: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px;
            border-radius: 10px;
            border-left: 3px solid var(--neon-red);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .highlight-cyan {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .timer-box {
            font-size: 13px;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.96);
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed var(--neon-red);
        }

        .prediction-box {
            background: rgba(3, 0, 1, 0.99);
            border: 1px solid rgba(255, 0, 51, 0.38);
            padding: 25px 15px;
            border-radius: 18px;
            margin-top: 15px;
        }

        .panel-section-title {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .period-value {
            font-size: 36px;
            margin: 10px 0;
            font-family: monospace;
            color: var(--text-white);
        }

        .trend-badge {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 12px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Color-coded tags for zero confusion */
        .color-big {
            color: #ffaa00 !important;
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.6);
        }
        .color-small {
            color: #00e5ff !important;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
        }

        .divider-line {
            border-top: 1px solid rgba(255, 0, 51, 0.2);
            margin: 18px 0;
        }

        .numbers-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .num-card {
            background: linear-gradient(135deg, rgba(255, 0, 51, 0.14), rgba(15, 0, 2, 0.96));
            border: 1px solid rgba(255, 0, 51, 0.48);
            padding: 15px 10px;
            width: 130px;
            border-radius: 14px;
        }

        .number-output {
            font-size: 50px;
            font-weight: 900;
            display: block;
        }

        .chance-indicator {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-top: 5px;
        }

        #auth-screen { display: block; }
        #matrix-dashboard { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-title">HACKII</h1>
        <div class="sub-title">Ultra Pattern Matrix Online</div>

        <div id="auth-screen">
            <div class="glass-card">
                <div class="input-container">
                    <input type="text" id="access-uid-input" placeholder="ENTER SECURE ACCESS KEY" autocomplete="off">
                </div>
                <button class="btn-primary" onclick="attemptSecureLogin()">INITIALIZE CORE SECURE NODE</button>
                <p class="helper-text" id="auth-status-msg" style="color: var(--neon-laser); font-weight: bold;"></p>
            </div>
        </div>

        <div id="matrix-dashboard">
            <div class="uid-tag">
                SECURE ACCESS KEY: <span class="highlight-cyan" id="display-user-uid">0</span>
            </div>

            <div class="timer-box">
                CALCULATING NEXT VECTOR ROUND: <span class="highlight-cyan" id="countdown-timer-text">00:59s</span>
            </div>

            <div class="prediction-box">
                <div class="panel-section-title">Upcoming Target Period</div>
                <div class="period-value" id="target-period-display">----</div>

                <div class="divider-line"></div>

                <div class="panel-section-title">Live Rent Expected Trend</div>
                <div class="trend-badge" id="trend-tag-display">WAIT</div>

                <div class="divider-line"></div>

                <div class="panel-section-title">High-Probability Aligned Targets</div>
                
                <div class="numbers-grid">
                    <div class="num-card">
                        <span class="number-output" id="num-target-1">-</span>
                        <span class="chance-indicator">PROBABILITY: 99%</span>
                    </div>
                    <div class="num-card">
                        <span class="number-output" id="num-target-2">-</span>
                        <span class="chance-indicator">PROBABILITY: 89%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let savedActiveUID = "";
        let localCountdownSecs = 60;
        let countdownTimerReference = null;

        // Visual Countdown Vector loops matching game cycles
        function runVisualClockEngine() {
            if (countdownTimerReference) clearInterval(countdownTimerReference);
            
            countdownTimerReference = setInterval(() => {
                localCountdownSecs--;
                if (localCountdownSecs <= 0) {
                    localCountdownSecs = 60; // Reset looping matrix
                }
                document.getElementById('countdown-timer-text').innerText = 
                    `00:${localCountdownSecs.toString().padStart(2, '0')}s`;
            }, 1000);
        }

        // Authentication Logic Loop Engine
        function attemptSecureLogin() {
            const typedUid = document.getElementById('access-uid-input').value.trim();
            if (!typedUid) {
                document.getElementById('auth-status-msg').innerText = "Access key input cannot be empty!";
                return;
            }

            fetch('/api/user/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: typedUid })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'approved') {
                    savedActiveUID = typedUid;
                    document.getElementById('display-user-uid').innerText = savedActiveUID;
                    
                    // Transition layouts flawlessly
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('matrix-dashboard').style.display = 'block';
                    
                    runVisualClockEngine();
                } else if (data.status === 'expired') {
                    document.getElementById('auth-status-msg').innerText = "ACCESS KEY EXPIRED! RENEW SESSION.";
                } else {
                    document.getElementById('auth-status-msg').innerText = "ACCESS KEY VALIDATION: PENDING/REJECTED!";
                }
            })
            .catch(err => {
                document.getElementById('auth-status-msg').innerText = "CRITICAL NET NODE COMMUNICATION ERROR.";
            });
        }

        // ==================================================================
        // SOCKET.IO REALTIME BROADCAST RECEIVER - COMPLETELY REMOVES 'UNDEFINED'
        // ==================================================================
        socket.on('predictionUpdate', (data) => {
            if (!data) return;

            // 1. Strict Target +1 Period Binding
            if (data.period) {
                document.getElementById('target-period-display').innerText = data.period;
            }

            // 2. Strict Redundant Variable Interceptor preventing undefined text
            let rawTrend = data.trend || data.trendText || data.output || data.trend_text || "WAIT";
            let finalizedTrend = rawTrend.toString().toUpperCase();

            const trendDisplayElement = document.getElementById('trend-tag-display');
            trendDisplayElement.innerText = finalizedTrend;

            // Resetting and appending classes matching original colors dynamically
            trendDisplayElement.className = "trend-badge";
            if (finalizedTrend === "BIG") {
                trendDisplayElement.classList.add("color-big");
            } else if (finalizedTrend === "SMALL") {
                trendDisplayElement.classList.add("color-small");
            }

            // 3. High-Probability Targets Array Safe Mapping
            if (data.topNumbers && data.topNumbers.length >= 2) {
                document.getElementById('num-target-1').innerText = data.topNumbers[0].num;
                document.getElementById('num-target-2').innerText = data.topNumbers[1].num;
            }
        });

        // Forced session wipe engine if admin revokes nodes
        socket.on('uidRevoked', (payload) => {
            if (payload && payload.uid === savedActiveUID) {
                alert("Session terminated securely by primary admin node.");
                window.location.reload();
            }
        });
    </script>
</body>
</html>

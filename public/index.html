<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKII - Cyber Gateway Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="brand-title">HACKII</h1>
        <h2 class="sub-title">YAAR WIN PREMIUM MAINFRAME</h2>

        <div class="glass-card">
            <button class="btn-reg" onclick="window.location.href='https://4yaarwin.com/#/register?invitationCode=18426755757'">
                🛡️ SECURE REGISTER LINK
            </button>
            <p class="helper-text">Naya account banakar apni official UID niiche box me verify karein.</p>
        </div>

        <div class="input-container">
            <input type="text" id="uidInput" placeholder="ENTER GAME UID KEY...">
            <span class="input-glow"></span>
        </div>

        <button class="btn-primary" onclick="verifyUID()">LAUNCH SERVER INTERFACE</button>

        <button class="btn-tg" onclick="window.location.href='https://t.me/hackii_sureshote'">
            💬 TELEGRAM LIVE SUPPORT
        </button>

        <div id="msgBox" class="msg-display">System Status: Secure Terminal Active</div>
    </div>

    <script>
        async function verifyUID() {
            const uid = document.getElementById('uidInput').value.trim();
            const msgBox = document.getElementById('msgBox');
            
            if(!uid) {
                msgBox.innerText = "Error: Input box cannot be empty!";
                msgBox.style.color = "var(--neon-red)";
                return;
            }

            msgBox.innerText = "Connecting to validation node...";
            msgBox.style.color = "var(--gold)";

            try {
                const res = await fetch('/api/user/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                const data = await res.json();
                
                if(data.status === 'approved') {
                    localStorage.setItem('user_uid', uid);
                    window.location.href = 'dashboard.html';
                } else {
                    msgBox.innerText = "HACKII bhai se uid verification karbou";
                    msgBox.style.color = "var(--neon-red)";
                }
            } catch (err) {
                msgBox.innerText = "Network node interface failure.";
                msgBox.style.color = "var(--neon-red)";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKII - High Premium Control Room</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div class="container dashboard-container">
        <h1 class="brand-title">HACKII</h1>
        <p class="dashboard-badge">ULTRA PATTERN MATRIX ONLINE</p>

        <div class="uid-tag">
            <span class="pulse-node"></span> 
            SECURE ACCESS KEY: <span id="uidDisplay" class="highlight-cyan">-</span>
        </div>

        <div class="timer-box" id="timerDisplay">⏳ CALCULATING NEXT VECTOR ROUND: 00:60s</div>

        <div class="prediction-box">
            <div class="panel-section-title">UPCOMING TARGET PERIOD</div>
            <h2 id="periodId" class="period-value">----</h2>
            
            <div class="divider-line"></div>

            <div class="panel-section-title">LIVE RENT EXPECTED TREND</div>
            <div id="trendPrediction" class="trend-badge">LOADING...</div>

            <div class="divider-line"></div>

            <div class="panel-section-title">HIGH-PROBABILITY ALIGNED TARGETS</div>
            <div class="numbers-grid">
                <div class="num-card">
                    <span id="num1" class="number-output">-</span>
                    <span class="chance-indicator">PROBABILITY: <span id="chance1">0%</span></span>
                </div>
                <div class="num-card">
                    <span id="num2" class="number-output">-</span>
                    <span class="chance-indicator">PROBABILITY: <span id="chance2">0%</span></span>
                </div>
            </div>
        </div>

        <button class="btn-primary" style="margin-top:20px;" onclick="window.location.href='https://4yaarwin.com/#/home'">
            🎮 GAME INTERFACE DASHBOARD
        </button>
    </div>

    <script>
        const uid = localStorage.getItem('user_uid');
        if(!uid) { window.location.href = 'index.html'; }
        document.getElementById('uidDisplay').innerText = uid || "NOT_FOUND";

        // Precise sync timer loops logic 
        setInterval(() => {
            const currentSeconds = new Date().getSeconds();
            const timeRemaining = 60 - currentSeconds;
            document.getElementById('timerDisplay').innerText = `⏳ CALCULATING NEXT VECTOR ROUND: 00:${timeRemaining < 10 ? "0" + timeRemaining : timeRemaining}s`;
        }, 1000);

        const socket = io();
        socket.on('predictionUpdate', (data) => {
            if(data && data.period) {
                document.getElementById('periodId').innerText = data.period;
                
                const trendEl = document.getElementById('trendPrediction');
                trendEl.innerText = data.prediction;
                
                if(data.prediction === "BIG") {
                    trendEl.style.color = "var(--neon-red)";
                    trendEl.style.textShadow = "0 0 30px rgba(255, 0, 51, 0.8)";
                } else if(data.prediction === "SMALL") {
                    trendEl.style.color = "var(--neon-cyan)";
                    trendEl.style.textShadow = "0 0 30px rgba(0, 229, 255, 0.8)";
                }

                if (data.topNumbers && data.topNumbers.length >= 2) {
                    document.getElementById('num1').innerText = data.topNumbers[0].num;
                    document.getElementById('chance1').innerText = data.topNumbers[0].chance + "%";
                    document.getElementById('num2').innerText = data.topNumbers[1].num;
                    document.getElementById('chance2').innerText = data.topNumbers[1].chance + "%";
                }
            }
        });

        socket.on('uidRevoked', (data) => {
            if(data.uid === uid) {
                localStorage.removeItem('user_uid');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
